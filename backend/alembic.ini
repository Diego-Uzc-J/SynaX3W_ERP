# Configuración de Alembic para el backend del ERP.
#
# La URL se resuelve en `alembic/env.py` a partir de `DATABASE_URL`, usando la
# misma normalización que `src/core/database.py`. Por eso aquí queda vacía.
#
# Uso (desde backend/):
#   alembic upgrade head
#   alembic revision --autogenerate -m "descripcion"
#   alembic downgrade -1

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
timezone = UTC
truncate_slug_length = 40
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
